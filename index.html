<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>正在前往作品集 · 兰朔</title>
<!-- 立即跳转（0 秒）。用 refresh 而非纯 JS：禁用 JS 的环境也能跳。 -->
<meta http-equiv="refresh" content="0; url=https://82.157.150.111/portfolio/#v03">
<link rel="canonical" href="https://82.157.150.111/portfolio/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='10' fill='%232e5f3b'/><text x='24' y='33' font-size='26' text-anchor='middle' fill='%23f4f8f0' font-family='Georgia,serif'>L</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;display:grid;place-items:center;
  font-family:"Segoe UI","Noto Sans SC",-apple-system,sans-serif;
  color:#1d2a20;background:#f4f8f0;text-align:center;padding:24px;
}
.box{max-width:440px}
svg{width:60px;height:60px;margin-bottom:22px}
.kicker{
  display:inline-flex;align-items:center;gap:10px;
  font-size:11.5px;letter-spacing:.24em;color:#3e7d4f;margin-bottom:14px;
}
.kicker::before,.kicker::after{content:"";width:26px;height:1.5px;background:#3e7d4f}
h1{font-family:Georgia,"Noto Serif SC",serif;font-size:26px;font-weight:400;color:#2e5f3b}
p{margin:14px 0 0;font-size:14px;line-height:1.9;color:#5c6b5e}
a.go{
  display:inline-flex;align-items:center;gap:8px;margin-top:26px;
  padding:13px 28px;border-radius:999px;
  background:#2e5f3b;color:#f4f8f0;font-size:14.5px;
  transition:transform .18s ease,background .18s ease;
}
a.go:hover{background:#275434;transform:translateY(-2px)}
a.go svg{width:15px;height:15px;margin:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.src{
  margin-top:30px;padding-top:18px;border-top:1px solid #d7e3d0;
  font-size:12px;color:#8aa08c;letter-spacing:.04em;word-break:break-all;
}
/* 转圈指示器：JS 跳转生效时可见，2s 后移除 */
.spin{
  width:26px;height:26px;margin:0 auto 18px;
  border:2px solid #d7e3d0;border-top-color:#3e7d4f;border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none;border-top-color:#d7e3d0}}
</style>
</head>
<body>
  <div class="box">
    <div class="spin" id="spin"></div>
    <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <path d="M24 6 12 26h7v16h10V26h7L24 6Z" fill="#2e5f3b" opacity=".9"/>
      <path d="M24 14 17 27h5v9h4v-9h5L24 14Z" fill="#8fbf9a"/>
    </svg>
    <div class="kicker">PORTFOLIO</div>
    <h1>正在前往作品集</h1>
    <p>如果没有自动跳转，请点击下方按钮。</p>
    <a class="go" href="https://82.157.150.111/portfolio/#v03">
      打开兰朔 · 作品集
      <svg viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></svg>
    </a>
    <div class="src">82.157.150.111/portfolio/</div>
  </div>

<script>
/* 与 <meta refresh> 双保险：replace 不留历史记录，
   用户按「后退」会回到 GitHub 而不会再次被弹走。 */
var TARGET = 'https://82.157.150.111/portfolio/#v03';
try {
  if ('replaceState' in history) {
    history.replaceState(null, '', location.pathname);  // 先擦掉本页，防后退回跳
  }
  location.replace(TARGET);
} catch (e) {
  /* file:// 或受限环境：忽略，交给 meta refresh 与手链 */
}
/* 转圈只短暂显示，随后移除 */
setTimeout(function(){
  var s = document.getElementById('spin');
  if (s) s.style.display = 'none';
}, 2000);
</script>
</body>
</html>
